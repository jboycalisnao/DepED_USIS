
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leon NHS | Registrar's Office</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=20260423b">
    <link rel="icon" type="image/png" href="./favicon.png?v=20260423b">
    <link rel="shortcut icon" href="./favicon.ico?v=20260423b">
    <link rel="apple-touch-icon" href="./usis-icon.png?v=20260423b">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#004E8C',
              accent: '#E21635',
              surface: '#f3f4f9',
              onSurface: '#1c1b1f',
              onPrimary: '#ffffff',
              onAccent: '#ffffff',
              surfaceVariant: '#e1e2ec',
              outline: '#74777f'
            },
            fontFamily: {
              sans: ['Helvetica Neue', 'Helvetica', 'sans-serif'],
            },
            boxShadow: {
              'ant-shadow': '0 6px 16px 0 rgba(0, 0, 0, 0.08), 0 3px 6px -4px rgba(0, 0, 0, 0.12), 0 9px 28px 8px rgba(0, 0, 0, 0.05)',
              'm3-1': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
              'm3-2': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1)',
              'm3-3': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1)',
            },
            animation: {
              'progress-fast': 'progress 1s ease-in-out infinite',
              'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
            },
            keyframes: {
              progress: {
                '0%': { width: '0%', marginLeft: '0%' },
                '50%': { width: '40%', marginLeft: '30%' },
                '100%': { width: '100%', marginLeft: '100%' },
              },
              shake: {
                '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                '40%, 60%': { transform: 'translate3d(4px, 0, 0)' },
              }
            }
          }
        }
      }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
